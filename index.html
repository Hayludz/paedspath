<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PaedsPath | Paediatrics learning</title>
  <meta name="description" content="A complete paediatrics study app: 130+ topics across 15 units with notes, curated lecture videos, quizzes, spaced-repetition flashcards and bedside calculators.">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f766e'/%3E%3Ccircle cx='16' cy='12' r='5' fill='%23fff'/%3E%3Cpath d='M8 26c1-5 4-7 8-7s7 2 8 7z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="css/styles.css">
  <script>try{var t=localStorage.getItem('paeds.theme');if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#outlet">Skip to content</a>
  <header class="top">
    <button id="menu" class="icon-btn only-mobile" type="button" aria-label="Open menu"><i class="ph ph-list" aria-hidden="true"></i></button>
    <a class="brand" href="#/"><span class="logo"><i class="ph-fill ph-baby" aria-hidden="true"></i></span><span>PaedsPath</span></a>
    <button id="search-open" class="search-pill" type="button"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><span>Search</span><kbd>/</kbd></button>
    <button id="theme" class="icon-btn" type="button" aria-label="Toggle light and dark theme"><i class="ph ph-circle-half" aria-hidden="true"></i></button>
  </header>
  <div class="shell">
    <aside class="side" aria-label="Main navigation">
      <nav>
        <a data-nav="home" href="#/"><i class="ph ph-house" aria-hidden="true"></i>Home</a>
        <a data-nav="units" href="#/units"><i class="ph ph-books" aria-hidden="true"></i>All units</a>
        <a data-nav="practise" href="#/practise"><i class="ph ph-list-checks" aria-hidden="true"></i>Practise</a>
        <a data-nav="cards" href="#/cards"><i class="ph ph-cards" aria-hidden="true"></i>Flashcards</a>
        <a data-nav="tools" href="#/tools"><i class="ph ph-calculator" aria-hidden="true"></i>Clinical tools</a>
        <a data-nav="reference" href="#/reference"><i class="ph ph-table" aria-hidden="true"></i>Quick reference</a>
        <a data-nav="saved" href="#/saved"><i class="ph ph-bookmark-simple" aria-hidden="true"></i>Saved & notes</a>
      </nav>
      <p class="side-h">Units</p>
      <ul id="unit-nav"></ul>
      <a class="about-link" data-nav="about" href="#/about">About & safety</a>
    </aside>
    <div id="scrim" class="scrim"></div>
    <main id="outlet" tabindex="-1"></main>
  </div>
  <nav class="bottom" aria-label="Quick navigation">
    <a data-nav="home" href="#/"><i class="ph ph-house" aria-hidden="true"></i><span>Home</span></a>
    <a data-nav="units" href="#/units"><i class="ph ph-books" aria-hidden="true"></i><span>Units</span></a>
    <a data-nav="practise" href="#/practise"><i class="ph ph-list-checks" aria-hidden="true"></i><span>Practise</span></a>
    <a data-nav="cards" href="#/cards"><i class="ph ph-cards" aria-hidden="true"></i><span>Cards</span></a>
    <a data-nav="tools" href="#/tools"><i class="ph ph-calculator" aria-hidden="true"></i><span>Tools</span></a>
  </nav>
  <dialog id="search" aria-label="Search topics">
    <div class="sbox"><i class="ph ph-magnifying-glass" aria-hidden="true"></i><input id="search-input" type="search" placeholder="Search topics, signs, drugs" autocomplete="off" aria-label="Search"></div>
    <ul id="search-results"></ul>
  </dialog>
  <noscript><p style="padding:2rem">PaedsPath needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
